name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit kerentanan dependensi produksi (report sekarang, jadikan gate
      # setelah CVE berikut teratasi):
      #  - better-auth via @neondatabase/auth@0.4.2-beta (pin better-auth@1.4.18)
      #    — belum ada rilis patched dari Neon; Dependabot akan buka PR otomatis.
      #  - react-router <8.3.0 — patch butuh major upgrade ke v8 (breaking).
      - name: Security audit (production deps)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
